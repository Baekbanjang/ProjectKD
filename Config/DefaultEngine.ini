[/Script/Engine.CollisionProfile]
; === Project_KD Collision — F2 #3 (docs/design/collision-channels.md) ===
; Philosophy: minimal ObjectType set. Friend/foe = GAS team, damage source = GE Context.
; Collision answers only "WHAT gets hit", never "WHO attacked".
; "WeaponTrace" is NOT a channel: AT_WeaponTrace queries ByObjectType{Pawn, Destructible}.
; "Environment"/"Pawn" use engine defaults (WorldStatic / ECC_Pawn) — nothing to define.
;
; --- Custom Object Channels (bTraceType=False) ---
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Projectile")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Destructible")
;
; --- Collision Profiles (one-click BP setup; ObjectType-query ignores responses, so pots
;     only need CollisionEnabled=Query* + ObjectType=Destructible to be hit by weapon trace) ---
+Profiles=(Name="Destructible",CollisionEnabled=QueryAndPhysics,bCanModify=True,ObjectTypeName="Destructible",CustomResponses=((Channel="Camera",Response=ECR_Ignore)),HelpMessage="Breakable props (pots). Caught by weapon trace via ByObjectType.")
+Profiles=(Name="Projectile",CollisionEnabled=QueryOnly,bCanModify=True,ObjectTypeName="Projectile",CustomResponses=((Channel="Pawn",Response=ECR_Overlap),(Channel="Destructible",Response=ECR_Overlap),(Channel="Camera",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore)),HelpMessage="Skill/ranged projectiles (AKDProjectile). Overlap Pawn/Destructible -> apply GE; Block world geometry -> destroy. Visibility Ignore: in-flight bullets must not block aim/AI sight traces.")


